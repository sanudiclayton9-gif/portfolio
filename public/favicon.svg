<svg width="520" height="120" viewBox="0 0 520 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="csGlow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- small terminal chip -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#0f1216" stroke="#232830" stroke-width="3"/>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="none" stroke="#39ff9d" stroke-width="1" opacity="0.25"/>

  <circle cx="28" cy="26" r="4" fill="#ff5f57"/>
  <circle cx="40" cy="26" r="4" fill="#febc2e"/>
  <circle cx="52" cy="26" r="4" fill="#28c840"/>

  <g filter="url(#csGlow2)">
    <path d="M26 52 L58 62 L26 72" fill="none" stroke="#39ff9d" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="66" y="55" width="18" height="14" rx="2" fill="#39ff9d">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1"
               dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="60" y="100" text-anchor="middle" font-family="'JetBrains Mono', monospace"
        font-weight="700" font-size="16" letter-spacing="4" fill="#eef1f4">CS</text>

  <!-- wordmark -->
  <text x="140" y="72" font-family="'JetBrains Mono', monospace" font-weight="600"
        font-size="34" fill="#eef1f4">clayton<tspan fill="#39ff9d">.</tspan>sanudi</text>
</svg>
